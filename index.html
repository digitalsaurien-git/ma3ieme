<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiSWxpYW4gLSBNZXMgQ291cnMiLCJzaG9ydF9uYW1lIjoiTWVzIENvdXJzIiwic3RhcnRfdXJsIjoiLiIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiMxYTFhMmUiLCJ0aGVtZV9jb2xvciI6IiMxYTFhMmUifQ==">
<title>Ilian - Mes Cours</title>
<style>
:root {
  --bg: #1a1a2e;
  --bg2: #16213e;
  --card: #0f3460;
  --card2: #0a2540;
  --accent: #e94560;
  --text: #eee;
  --text2: #aaa;
  --green: #00b894;
  --blue: #0984e3;
  --purple: #6c5ce7;
  --orange: #e17055;
  --yellow: #fdcb6e;
  --teal: #00cec9;
  --pink: #e84393;
  --red: #e94560;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100%;
  padding: env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}

/* HEADER */
.app-header {
  background: var(--bg2);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: env(safe-area-inset-top,0px);
  z-index: 100;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.app-header h1 { font-size: 1.1rem; font-weight: 700; flex: 1; }
.back-btn {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 1.5rem;
  cursor: pointer;
  padding: 4px 8px;
  display: none;
  align-items: center;
}
.back-btn.visible { display: flex; }
.header-actions { display: flex; gap: 8px; }
.icon-btn {
  background: none;
  border: none;
  color: var(--text2);
  font-size: 1.2rem;
  cursor: pointer;
  padding: 6px;
  border-radius: 8px;
  transition: background 0.2s;
}
.icon-btn:hover { background: rgba(255,255,255,0.1); }

/* SCREENS */
.screen { display: none; padding: 16px; max-width: 900px; margin: 0 auto; }
.screen.active { display: block; }

/* HERO */
.hero {
  text-align: center;
  padding: 24px 16px;
  background: linear-gradient(135deg, var(--bg2), var(--card));
  border-radius: var(--radius);
  margin-bottom: 24px;
}
.hero h2 { font-size: 1.4rem; margin: 12px 0 4px; }
.hero p { color: var(--text2); font-size: 0.95rem; }
#koalaHero { display: inline-block; }

/* STREAK BAR */
.streak-bar {
  background: var(--bg2);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.streak-bar .streak-icon { font-size: 1.4rem; }
.streak-info { flex: 1; }
.streak-info .streak-label { font-size: 0.8rem; color: var(--text2); }
.streak-info .streak-count { font-size: 1.1rem; font-weight: 700; color: var(--yellow); }
.streak-dots { display: flex; gap: 6px; }
.streak-dot {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--card);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem;
}
.streak-dot.done { background: var(--yellow); color: #222; }

/* SUBJECTS GRID */
.subjects-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (min-width: 640px) {
  .subjects-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 1024px) {
  .subjects-grid { grid-template-columns: repeat(4, 1fr); }
}
.subject-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px 12px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.18s, box-shadow 0.18s;
  border: 2px solid transparent;
  position: relative;
  overflow: hidden;
}
.subject-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--subj-color, #fff);
  opacity: 0.07;
  transition: opacity 0.18s;
}
.subject-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.subject-card:hover::before { opacity: 0.12; }
.subject-card .emoji { font-size: 2rem; display: block; margin-bottom: 8px; }
.subject-card .name { font-size: 0.9rem; font-weight: 600; }
.subject-card .chapter-count { font-size: 0.75rem; color: var(--text2); margin-top: 4px; }
.badge {
  position: absolute;
  top: 8px; right: 8px;
  background: var(--accent);
  color: #fff;
  font-size: 0.65rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 20px;
}

/* CHAPTERS LIST */
.chapter-list { display: flex; flex-direction: column; gap: 10px; }
.chapter-item {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: transform 0.15s;
  border-left: 4px solid var(--ch-color, var(--accent));
}
.chapter-item:hover { transform: translateX(4px); }
.chapter-item .ch-num {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--ch-color, var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.85rem;
  flex-shrink: 0;
  color: #fff;
}
.chapter-item .ch-info { flex: 1; min-width: 0; }
.chapter-item .ch-title { font-weight: 600; font-size: 0.95rem; }
.chapter-item .ch-desc { font-size: 0.78rem; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chapter-item .ch-progress { font-size: 0.75rem; color: var(--text2); }
.ch-done-icon { color: var(--green); font-size: 1.1rem; }

/* ACTIVITIES */
.activities-header {
  background: var(--bg2);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 20px;
  display: flex;
  gap: 16px;
  align-items: center;
}
.activities-header .koala-wrap { flex-shrink: 0; }
.activities-header .ch-meta h3 { font-size: 1rem; font-weight: 700; }
.activities-header .ch-meta p { font-size: 0.82rem; color: var(--text2); margin-top: 4px; }
.activities-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (min-width: 640px) {
  .activities-grid { grid-template-columns: repeat(4, 1fr); }
}
.activity-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px 12px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  border: 2px solid transparent;
}
.activity-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--act-color, var(--accent)); }
.activity-card .act-icon { font-size: 2rem; display: block; margin-bottom: 8px; }
.activity-card .act-name { font-size: 0.85rem; font-weight: 600; }
.activity-card .act-count { font-size: 0.75rem; color: var(--text2); margin-top: 4px; }
.activity-card.done .act-icon::after { content: ' ✓'; font-size: 0.8rem; }

/* QUIZ */
.quiz-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}
.quiz-progress-bar {
  flex: 1;
  height: 6px;
  background: var(--card);
  border-radius: 3px;
  overflow: hidden;
}
.quiz-progress-bar .fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.3s;
}
.quiz-progress span { font-size: 0.82rem; color: var(--text2); }
.question-card {
  background: var(--bg2);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.question-text { font-size: 1rem; font-weight: 600; line-height: 1.5; margin-bottom: 4px; }
.question-hint { font-size: 0.8rem; color: var(--text2); margin-bottom: 16px; }
.options-list { display: flex; flex-direction: column; gap: 10px; }
.option-btn {
  background: var(--card);
  border: 2px solid transparent;
  color: var(--text);
  border-radius: 10px;
  padding: 12px 16px;
  text-align: left;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.18s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.option-btn:hover:not(:disabled) { border-color: var(--blue); background: rgba(9,132,227,0.15); }
.option-btn.correct { border-color: var(--green); background: rgba(0,184,148,0.18); }
.option-btn.wrong { border-color: var(--red); background: rgba(233,69,96,0.18); }
.option-btn:disabled { cursor: default; }
.option-letter {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.78rem; font-weight: 700;
  flex-shrink: 0;
}
.option-btn.correct .option-letter { background: var(--green); color: #fff; }
.option-btn.wrong .option-letter { background: var(--red); color: #fff; }
.explanation-box {
  background: rgba(0,184,148,0.12);
  border: 1px solid var(--green);
  border-radius: 10px;
  padding: 12px 14px;
  margin-top: 14px;
  font-size: 0.85rem;
  display: none;
}
.explanation-box.wrong-exp { background: rgba(233,69,96,0.12); border-color: var(--red); }
.explanation-box.visible { display: block; }
.next-btn {
  display: none;
  width: 100%;
  margin-top: 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s;
}
.next-btn:hover { opacity: 0.88; }
.next-btn.visible { display: block; }
.quiz-score {
  text-align: center;
  padding: 32px 16px;
}
.score-circle {
  width: 120px; height: 120px;
  border-radius: 50%;
  margin: 0 auto 16px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-size: 1.8rem; font-weight: 800;
}
.score-msg { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
.score-sub { color: var(--text2); font-size: 0.88rem; margin-bottom: 24px; }
.score-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
  background: var(--card);
  color: var(--text);
  border: none;
  border-radius: 10px;
  padding: 10px 18px;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.18s;
}
.btn:hover { background: var(--card2); }
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover { background: #c73652; }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: #00a381; }

/* FLASHCARDS */
.fc-progress { text-align: right; font-size: 0.82rem; color: var(--text2); margin-bottom: 12px; }
.flashcard-wrap {
  perspective: 1000px;
  height: 220px;
  margin-bottom: 16px;
  cursor: pointer;
}
.flashcard {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s;
  border-radius: var(--radius);
}
.flashcard.flipped { transform: rotateY(180deg); }
.fc-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  text-align: center;
}
.fc-front {
  background: var(--card);
  border: 2px solid rgba(255,255,255,0.1);
}
.fc-back {
  background: var(--card2);
  border: 2px solid var(--blue);
  transform: rotateY(180deg);
}
.fc-label { font-size: 0.72rem; color: var(--text2); margin-bottom: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
.fc-text { font-size: 1rem; font-weight: 600; line-height: 1.5; }
.fc-hint { font-size: 0.78rem; color: var(--text2); margin-top: 6px; }
.fc-nav { display: flex; gap: 10px; align-items: center; justify-content: center; }
.fc-nav button {
  background: var(--card);
  border: none; color: var(--text);
  padding: 10px 18px; border-radius: 10px;
  cursor: pointer; font-size: 0.88rem;
  transition: background 0.15s;
}
.fc-nav button:hover { background: var(--card2); }
.fc-nav button:disabled { opacity: 0.4; cursor: default; }
.fc-counter { color: var(--text2); font-size: 0.82rem; }
.fc-known-btns { display: flex; gap: 10px; margin-top: 12px; }
.fc-known-btns button {
  flex: 1; padding: 10px; border: none; border-radius: 10px;
  font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
}
.fc-known-btns .btn-yes { background: var(--green); color: #fff; }
.fc-known-btns .btn-no { background: var(--card2); color: var(--text2); }
.fc-known-btns button:hover { opacity: 0.85; }
.fc-complete { text-align: center; padding: 24px; display: none; }

/* SUMMARY */
.summary-actions { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.summary-content {
  background: var(--bg2);
  border-radius: var(--radius);
  padding: 20px;
  line-height: 1.7;
}
.summary-content h2 { font-size: 1.2rem; margin-bottom: 16px; color: var(--accent); }
.summary-content h3 { font-size: 1rem; margin: 14px 0 8px; color: var(--yellow); }
.summary-content h4 { font-size: 0.9rem; margin: 10px 0 6px; color: var(--blue); }
.summary-content p { font-size: 0.9rem; margin-bottom: 10px; color: var(--text); }
.summary-content ul { margin: 6px 0 10px 20px; }
.summary-content li { font-size: 0.88rem; margin-bottom: 4px; }
.summary-content strong { color: var(--yellow); }
.summary-content em { color: var(--teal); }
.summary-content .date-box {
  background: var(--card);
  border-left: 3px solid var(--accent);
  padding: 8px 12px;
  border-radius: 4px;
  margin: 8px 0;
  font-size: 0.85rem;
}
.reading-active { border-left: 3px solid var(--green); }

/* MINDMAP */
.mindmap-wrap { overflow-x: auto; }
.mindmap-svg { display: block; margin: 0 auto; max-width: 100%; }

/* TOAST */
.toast {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom,0px));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--card);
  border: 1px solid rgba(255,255,255,0.15);
  color: var(--text);
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 0.88rem;
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  z-index: 999;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* RESOURCES OVERLAY */
.resources-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  display: none;
  align-items: flex-end;
}
.resources-overlay.open { display: flex; }
.resources-panel {
  background: var(--bg2);
  border-radius: 20px 20px 0 0;
  padding: 20px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
}
.res-header { display: flex; align-items: center; margin-bottom: 16px; }
.res-header h3 { flex: 1; font-size: 1rem; }
.res-close {
  background: none; border: none; color: var(--text2);
  font-size: 1.5rem; cursor: pointer; padding: 4px 8px;
}
.res-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.res-tab {
  background: var(--card);
  border: none; color: var(--text2);
  padding: 8px 14px; border-radius: 8px;
  cursor: pointer; font-size: 0.82rem;
  transition: all 0.15s;
}
.res-tab.active { background: var(--accent); color: #fff; }
.res-content { font-size: 0.85rem; line-height: 1.8; }
.res-content h4 { color: var(--yellow); margin: 12px 0 6px; font-size: 0.9rem; }
.res-content ul { margin-left: 16px; }
.res-content li { margin-bottom: 4px; }
.copy-btn {
  background: var(--card);
  border: none; color: var(--text);
  padding: 8px 16px; border-radius: 8px;
  cursor: pointer; font-size: 0.8rem;
  margin-top: 12px; display: flex; align-items: center; gap: 6px;
}
.copy-btn:hover { background: var(--card2); }

/* LARGE SCREEN SIDEBAR */
@media (min-width: 1024px) {
  body { display: flex; min-height: 100vh; }
  .sidebar {
    width: 260px;
    background: var(--bg2);
    border-right: 1px solid rgba(255,255,255,0.07);
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text2);
    padding: 8px 12px;
    margin-bottom: 4px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.88rem;
    transition: background 0.15s;
    color: var(--text2);
  }
  .sidebar-item:hover { background: var(--card); color: var(--text); }
  .sidebar-item.active { background: var(--card); color: var(--text); font-weight: 600; }
  .sidebar-emoji { font-size: 1.1rem; }
  .main-area { flex: 1; min-width: 0; }
  .app-header { top: 0; }
}
@media (min-width: 1400px) {
  .screen { max-width: 1100px; }
  .activities-grid { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body>

<!-- SIDEBAR (desktop) -->
<nav class="sidebar" id="sidebar" style="display:none">
  <div class="sidebar-title">Matières</div>
  <div id="sidebarItems"></div>
</nav>

<div class="main-area" id="mainArea">
<!-- HEADER -->
<header class="app-header">
  <button class="back-btn" id="backBtn" onclick="goBack()">&#8249;</button>
  <h1 id="headerTitle">Ilian - Mes Cours</h1>
  <div class="header-actions">
    <button class="icon-btn" onclick="openResources()" title="Ressources">📋</button>
    <button class="icon-btn" onclick="toggleTTS()" id="ttsBtn" title="Lecture">🔊</button>
  </div>
</header>

<!-- SCREEN: SUBJECTS -->
<div class="screen active" id="screenSubjects">
  <div class="hero">
    <div id="koalaHero"></div>
    <h2>Salut Ilian ! 🎓</h2>
    <p>Quelle matière révises-tu aujourd'hui&nbsp;?</p>
  </div>
  <div class="streak-bar">
    <span class="streak-icon">🔥</span>
    <div class="streak-info">
      <div class="streak-label">Série du jour</div>
      <div class="streak-count" id="streakCount">0 activité</div>
    </div>
    <div class="streak-dots" id="streakDots"></div>
  </div>
  <div class="subjects-grid" id="subjectsGrid"></div>
</div>

<!-- SCREEN: CHAPTERS -->
<div class="screen" id="screenChapters">
  <div class="chapter-list" id="chapterList"></div>
</div>

<!-- SCREEN: ACTIVITIES -->
<div class="screen" id="screenActivities">
  <div class="activities-header">
    <div class="koala-wrap" id="koalaActivity"></div>
    <div class="ch-meta">
      <h3 id="actChapterTitle"></h3>
      <p id="actChapterDesc"></p>
    </div>
  </div>
  <div class="activities-grid" id="activitiesGrid"></div>
</div>

<!-- SCREEN: QUIZ -->
<div class="screen" id="screenQuiz">
  <div class="quiz-progress">
    <div class="quiz-progress-bar"><div class="fill" id="quizFill"></div></div>
    <span id="quizProgressLabel">0/0</span>
  </div>
  <div id="quizContent"></div>
</div>

<!-- SCREEN: FLASHCARDS -->
<div class="screen" id="screenFlash">
  <div class="fc-progress" id="fcProgress"></div>
  <div class="flashcard-wrap" onclick="flipCard()">
    <div class="flashcard" id="flashcard">
      <div class="fc-face fc-front">
        <div>
          <div class="fc-label">Mot / Concept</div>
          <div class="fc-text" id="fcFront"></div>
          <div class="fc-hint">Tape pour retourner</div>
        </div>
      </div>
      <div class="fc-face fc-back">
        <div>
          <div class="fc-label">Définition / Explication</div>
          <div class="fc-text" id="fcBack"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="fc-known-btns" id="fcKnownBtns">
    <button class="btn-no" onclick="fcMark(false)">❌ À revoir</button>
    <button class="btn-yes" onclick="fcMark(true)">✓ Je sais !</button>
  </div>
  <div class="fc-nav">
    <button onclick="fcNav(-1)" id="fcPrev">← Précédent</button>
    <span class="fc-counter" id="fcCounter"></span>
    <button onclick="fcNav(1)" id="fcNext">Suivant →</button>
  </div>
  <div class="fc-complete" id="fcComplete">

<p>Chaque cellule contient un <strong>noyau</strong> avec des <strong>chromosomes</strong> (46 chez l'Homme, 23 paires). Les chromosomes sont constitués d'<strong>ADN</strong> enroulé.</p>
<p>L'ADN est une double hélice formée de 4 bases : <em>Adénine (A), Thymine (T), Guanine (G), Cytosine (C)</em>. A s'apparie avec T, G avec C.</p>
<h3>2. Gènes et allèles</h3>
<ul>
<li><strong>Gène</strong> : séquence d'ADN codant pour une protéine, à un locus précis</li>
<li><strong>Allèle</strong> : version d'un gène (dominant ou récessif)</li>
<li><strong>Génotype</strong> : ensemble des allèles d'un individu</li>
<li><strong>Phénotype</strong> : caractères observables résultant du génotype</li>
</ul>
<h3>3. Transmission des caractères</h3>
<p>Les gamètes (spermatozoïdes, ovules) contiennent <strong>23 chromosomes</strong> (méiose). La fécondation reconstitue les <strong>46 chromosomes</strong>.</p>
<p>Si un allèle est <strong>dominant</strong> (noté A) : il s'exprime même avec un allèle récessif (a). Seul <em>aa</em> exprime le caractère récessif.</p>
<h3>4. Les mutations</h3>
<p>Modification de la séquence ADN. Mutagènes : UV, tabac, rayons X. Peut entraîner un cancer ou une maladie génétique.</p>`,

// ── STATE ───────────────────────────────────────────────────
let state = {
  subject: null, chapter: null, activity: null,
  quizIndex: 0, quizScore: 0, quizAnswered: false,
  fcIndex: 0, fcKnown: 0, fcFlipped: false,
  streak: 0, completedToday: [],
  ttsActive: false, speechInst: null
};

// ── UTILS ───────────────────────────────────────────────────
function showToast(msg, duration) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration || 2500);
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function updateHeader(title, showBack) {
  document.getElementById('headerTitle').textContent = title;
  const btn = document.getElementById('backBtn');
  if (showBack) btn.classList.add('visible'); else btn.classList.remove('visible');
}
function goBack() {
  if (state.activity) {
    state.activity = null;
    showActivities();
  } else if (state.chapter !== null) {
    state.chapter = null;
    showChapters(state.subject);
  } else {
    state.subject = null;
    showSubjects();
  }
}

// ── STREAK ──────────────────────────────────────────────────
function updateStreak() {
  const el = document.getElementById('streakCount');
  const n = state.completedToday.length;
  el.textContent = n + ' activité' + (n > 1 ? 's' : '') + ' aujourd\'hui';
  const dots = document.getElementById('streakDots');
  dots.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const d = document.createElement('div');
    d.className = 'streak-dot' + (i < n ? ' done' : '');
    d.textContent = i < n ? '✓' : (i + 1);
    dots.appendChild(d);
  }
}
function recordCompletion(key) {
  if (!state.completedToday.includes(key)) {
    state.completedToday.push(key);
    updateStreak();
    if (state.completedToday.length % 3 === 0) {
      document.getElementById('koalaHero').innerHTML = getKoalaSVG(80, 'star');
      showToast('🌟 Super Ilian ! ' + state.completedToday.length + ' activités complètes !', 3000);
    }
  }
}

// ── SUBJECTS SCREEN ─────────────────────────────────────────
function showSubjects() {
  state.subject = null; state.chapter = null; state.activity = null;
  stopSpeech();
  showScreen('screenSubjects');
  updateHeader('Ilian — Mes Cours', false);
  document.getElementById('koalaHero').innerHTML = getKoalaSVG(80, 'normal');
  const grid = document.getElementById('subjectsGrid');
  grid.innerHTML = '';
  Object.entries(DATA).forEach(([key, subj]) => {
    const card = document.createElement('div');
    card.className = 'subject-card';
    card.style.setProperty('--subj-color', subj.color);
    const chapCount = subj.chapters.length;
    card.innerHTML = `<span class="emoji">${subj.emoji}</span><div class="name">${subj.name}</div><div class="chapter-count">${chapCount} chapitre${chapCount>1?'s':''}</div>`;
    card.onclick = () => showChapters(key);
    grid.appendChild(card);
  });
  updateStreak();
  buildSidebar();
  if (window.innerWidth >= 1024) document.getElementById('sidebar').style.display = 'flex';
}

// ── SIDEBAR ──────────────────────────────────────────────────
function buildSidebar() {
  const el = document.getElementById('sidebarItems');
  el.innerHTML = '';
  Object.entries(DATA).forEach(([key, subj]) => {
    const item = document.createElement('div');
    item.className = 'sidebar-item' + (state.subject === key ? ' active' : '');
    item.innerHTML = `<span class="sidebar-emoji">${subj.emoji}</span>${subj.name}`;
    item.onclick = () => showChapters(key);
    el.appendChild(item);
  });
}

// ── CHAPTERS SCREEN ──────────────────────────────────────────
function showChapters(subjKey) {
  state.subject = subjKey;
  state.chapter = null; state.activity = null;
  stopSpeech();
  const subj = DATA[subjKey];
  showScreen('screenChapters');
  updateHeader(subj.emoji + ' ' + subj.name, true);
  buildSidebar();
  const list = document.getElementById('chapterList');
  list.innerHTML = '';
  subj.chapters.forEach((ch, i) => {
    const item = document.createElement('div');
    item.className = 'chapter-item';
    item.style.setProperty('--ch-color', subj.color);
    item.innerHTML = `<div class="ch-num" style="background:${subj.color}">${i+1}</div>
      <div class="ch-info">
        <div class="ch-title">${ch.title}</div>
        <div class="ch-desc">${ch.desc}</div>
      </div>`;
    item.onclick = () => showActivities(i);
    list.appendChild(item);
  });
}

// ── ACTIVITIES SCREEN ────────────────────────────────────────
function showActivities(chIdx) {
  if (chIdx !== undefined) state.chapter = chIdx;
  state.activity = null;
  stopSpeech();
  const subj = DATA[state.subject];
  const ch = subj.chapters[state.chapter];
  showScreen('screenActivities');
  updateHeader(ch.title, true);
  document.getElementById('actChapterTitle').textContent = ch.title;
  document.getElementById('actChapterDesc').textContent = ch.desc;
  document.getElementById('koalaActivity').innerHTML = getKoalaSVG(56, 'normal');
  const grid = document.getElementById('activitiesGrid');
  grid.innerHTML = '';
  const acts = [
    { id: 'resume', icon: '📄', name: 'Résumé', count: '1 fiche', color: subj.color },
    { id: 'quiz', icon: '🎯', name: 'Quiz', count: ch.quiz.length + ' questions', color: '#e94560' },
    { id: 'flashcards', icon: '🃏', name: 'Flashcards', count: ch.flashcards.length + ' cartes', color: '#fdcb6e' },
    { id: 'mindmap', icon: '🗺️', name: 'Carte mentale', count: '1 schéma', color: '#00cec9' }
  ];
  acts.forEach(act => {
    const card = document.createElement('div');
    card.className = 'activity-card';
    card.style.setProperty('--act-color', act.color);
    card.innerHTML = `<span class="act-icon">${act.icon}</span><div class="act-name">${act.name}</div><div class="act-count">${act.count}</div>`;
    card.onclick = () => startActivity(act.id);
    grid.appendChild(card);
  });
}

function startActivity(actId) {
  state.activity = actId;
  const subj = DATA[state.subject];
  const ch = subj.chapters[state.chapter];
  if (actId === 'quiz') startQuiz(ch);
  else if (actId === 'flashcards') startFlash(ch);
  else if (actId === 'resume') showSummary(ch);
  else if (actId === 'mindmap') showMindmap(ch, subj.color);
}

// ── QUIZ ENGINE ──────────────────────────────────────────────
function startQuiz(ch) {
  state.quizIndex = 0; state.quizScore = 0; state.quizAnswered = false;
  showScreen('screenQuiz');
  updateHeader('Quiz — ' + ch.title, true);
  renderQuestion(ch);
}
function renderQuestion(ch) {
  const q = ch.quiz[state.quizIndex];
  const total = ch.quiz.length;
  document.getElementById('quizFill').style.width = (state.quizIndex / total * 100) + '%';
  document.getElementById('quizProgressLabel').textContent = (state.quizIndex + 1) + '/' + total;
  const letters = ['A','B','C','D'];
  const content = document.getElementById('quizContent');
  content.innerHTML = `
    <div class="question-card">
      <div class="question-text">${q.q}</div>
      <div class="question-hint">Choisis la bonne réponse</div>
      <div class="options-list">
        ${q.options.map((opt, i) => `
          <button class="option-btn" onclick="answerQuiz(${i},${state.quizIndex})" id="opt${i}">
            <span class="option-letter">${letters[i]}</span>${opt}
          </button>`).join('')}
      </div>
      <div class="explanation-box" id="expBox">${q.explanation}</div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
        ${state.quizIndex + 1 < total ? 'Question suivante →' : 'Voir le résultat'}
      </button>
    </div>`;
}
function answerQuiz(chosen, qIdx) {
  if (state.quizAnswered) return;
  state.quizAnswered = true;
  const ch = DATA[state.subject].chapters[state.chapter];
  const q = ch.quiz[qIdx];
  const expBox = document.getElementById('expBox');
  for (let i = 0; i < q.options.length; i++) {
    const btn = document.getElementById('opt' + i);
    if (btn) btn.disabled = true;
  }
  if (chosen === q.correct) {
    state.quizScore++;
    document.getElementById('opt' + chosen).classList.add('correct');
    expBox.classList.add('visible');
    document.getElementById('koalaActivity').innerHTML = getKoalaSVG(56, 'happy');
    showToast(['Excellent ! 🎉','Parfait ! ⭐','Bravo Ilian ! 🏆','Super ! 👏'][Math.floor(Math.random()*4)]);
  } else {
    document.getElementById('opt' + chosen).classList.add('wrong');
    document.getElementById('opt' + q.correct).classList.add('correct');
    expBox.classList.add('visible', 'wrong-exp');
  }
  document.getElementById('nextBtn').classList.add('visible');
}
function nextQuestion() {
  const ch = DATA[state.subject].chapters[state.chapter];
  state.quizIndex++;
  state.quizAnswered = false;
  if (state.quizIndex >= ch.quiz.length) {
    showQuizScore(ch);
  } else {
    renderQuestion(ch);
  }
}
function showQuizScore(ch) {
  const pct = Math.round(state.quizScore / ch.quiz.length * 100);
  const subj = DATA[state.subject];
  let color = pct >= 80 ? 'var(--green)' : pct >= 60 ? 'var(--yellow)' : 'var(--red)';
  let msg = pct === 100 ? '🏆 Parfait !' : pct >= 80 ? '🎉 Excellent !' : pct >= 60 ? '👍 Bien !' : '💪 Continue !';
  document.getElementById('quizContent').innerHTML = `
    <div class="quiz-score">
      <div style="font-size:3rem;margin-bottom:12px">${pct===100?'🏆':pct>=80?'⭐':pct>=60?'👍':'💪'}</div>
      <div class="score-circle" style="background:${color}22;border:3px solid ${color}">
        <div style="color:${color}">${state.quizScore}/${ch.quiz.length}</div>
        <div style="font-size:0.9rem;color:var(--text2)">${pct}%</div>
      </div>
      <div class="score-msg" style="margin-top:16px">${msg}</div>
      <div class="score-sub">Tu as répondu juste à ${state.quizScore} question${state.quizScore>1?'s':''} sur ${ch.quiz.length}</div>
      <div class="score-actions">
        <button class="btn btn-accent" onclick="startActivity('quiz')">Recommencer</button>
        <button class="btn btn-green" onclick="showActivities()">← Activités</button>
      </div>
    </div>`;
  recordCompletion(state.subject + '_' + state.chapter + '_quiz');
  document.getElementById('quizFill').style.width = '100%';
}

// ── FLASHCARDS ENGINE ────────────────────────────────────────
function startFlash(ch) {
  state.fcIndex = 0; state.fcKnown = 0; state.fcFlipped = false;
  showScreen('screenFlash');
  updateHeader('Flashcards — ' + ch.title, true);
  document.getElementById('fcComplete').style.display = 'none';
  document.getElementById('fcKnownBtns').style.display = 'flex';
  renderFlash(ch);
}
function renderFlash(ch) {
  const card = ch.flashcards[state.fcIndex];
  document.getElementById('fcProgress').textContent = (state.fcIndex + 1) + ' / ' + ch.flashcards.length;
  document.getElementById('fcCounter').textContent = (state.fcIndex + 1) + '/' + ch.flashcards.length;
  document.getElementById('fcFront').textContent = card.front;
  document.getElementById('fcBack').textContent = card.back;
  document.getElementById('flashcard').classList.remove('flipped');
  state.fcFlipped = false;
  document.getElementById('fcPrev').disabled = state.fcIndex === 0;
  document.getElementById('fcNext').disabled = state.fcIndex === ch.flashcards.length - 1;
}
function flipCard() {
  const fc = document.getElementById('flashcard');
  if (state.fcFlipped) { fc.classList.remove('flipped'); state.fcFlipped = false; }
  else { fc.classList.add('flipped'); state.fcFlipped = true; }
}
function fcNav(dir) {
  const ch = DATA[state.subject].chapters[state.chapter];
  state.fcIndex = Math.max(0, Math.min(ch.flashcards.length - 1, state.fcIndex + dir));
  renderFlash(ch);
}
function fcMark(known) {
  if (known) {
    state.fcKnown++;
    showToast('✓ Bien mémorisé ! +1', 1500);
  }
  const ch = DATA[state.subject].chapters[state.chapter];
  if (state.fcIndex < ch.flashcards.length - 1) {
    state.fcIndex++;
    renderFlash(ch);
  } else {
    document.getElementById('fcComplete').style.display = 'block';
    document.getElementById('fcKnownBtns').style.display = 'none';
    document.getElementById('fcScore').textContent = state.fcKnown + ' carte' + (state.fcKnown>1?'s':'') + ' mémorisée' + (state.fcKnown>1?'s':'') + ' sur ' + ch.flashcards.length;
    recordCompletion(state.subject + '_' + state.chapter + '_fc');
  }
}
function restartFlash() {
  startFlash(DATA[state.subject].chapters[state.chapter]);
}

// ── SUMMARY ──────────────────────────────────────────────────
function showSummary(ch) {
  showScreen('screenSummary');
  updateHeader('Résumé — ' + ch.title, true);
  document.getElementById('summaryContent').innerHTML = ch.summary;
  recordCompletion(state.subject + '_' + state.chapter + '_summary');
}
function speakSummary() {
  if (!('speechSynthesis' in window)) { showToast('Synthèse vocale non supportée'); return; }
  stopSpeech();
  const text = document.getElementById('summaryContent').innerText;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'fr-FR'; utter.rate = 0.92;
  window.speechSynthesis.speak(utter);
  document.getElementById('speakBtn').textContent = '🔊 Lecture en cours…';
  utter.onend = () => { document.getElementById('speakBtn').textContent = '🔊 Écouter'; };
}
function stopSpeech() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  const btn = document.getElementById('speakBtn');
  if (btn) btn.textContent = '🔊 Écouter';
}
function toggleTTS() {
  if (window.speechSynthesis && window.speechSynthesis.speaking) stopSpeech();
  else if (state.activity === 'resume') speakSummary();
}

// ── MINDMAP ──────────────────────────────────────────────────
function showMindmap(ch, defaultColor) {
  showScreen('screenMindmap');
  updateHeader('Carte mentale — ' + ch.title, true);
  drawMindmap(ch.mindmap, defaultColor);
  recordCompletion(state.subject + '_' + state.chapter + '_mindmap');
}
function drawMindmap(mm, defaultColor) {
  const svg = document.getElementById('mindmapSvg');
  const W = 700, H = 500;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.innerHTML = '';
  const cx = W / 2, cy = H / 2;
  const branches = mm.branches;
  const angleStep = (2 * Math.PI) / branches.length;
  const branchR = 160;
  let html = '';
  // Center
  html += `<ellipse cx="${cx}" cy="${cy}" rx="70" ry="36" fill="${defaultColor || '#e94560'}" opacity="0.9"/>
  <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="bold" fill="#fff">${mm.center}</text>`;
  branches.forEach((br, i) => {
    const angle = angleStep * i - Math.PI / 2;
    const bx = cx + Math.cos(angle) * branchR;
    const by = cy + Math.sin(angle) * branchR;
    const color = br.color || defaultColor || '#888';
    // Line from center to branch
    html += `<line x1="${cx}" y1="${cy}" x2="${bx}" y2="${by}" stroke="${color}" stroke-width="2" opacity="0.6"/>`;
    // Branch ellipse
    html += `<ellipse cx="${bx}" cy="${by}" rx="54" ry="22" fill="${color}" opacity="0.85"/>
    <text x="${bx}" y="${by}" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="bold" fill="#fff">${br.label}</text>`;
    // Children
    if (br.children) {
      const childAngleOffset = (angleStep * 0.5) / (br.children.length + 1);
      br.children.forEach((child, j) => {
        const childAngle = angle + childAngleOffset * (j - (br.children.length - 1) / 2);
        const childR = 90;
        const childX = bx + Math.cos(childAngle) * childR;
        const childY = by + Math.sin(childAngle) * childR;
        html += `<line x1="${bx}" y1="${by}" x2="${childX}" y2="${childY}" stroke="${color}" stroke-width="1.5" opacity="0.4"/>
        <ellipse cx="${childX}" cy="${childY}" rx="44" ry="16" fill="${color}" opacity="0.3" stroke="${color}" stroke-width="1"/>
        <text x="${childX}" y="${childY}" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#fff">${child}</text>`;
      });
    }
  });
  svg.innerHTML = html;
}
